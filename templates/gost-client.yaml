services:
  - name: direct
    addr: 127.0.0.1:__GOST_DIRECT_PORT__
    handler:
      type: auto
      chain: direct
    listener:
      type: tcp
  - name: warp
    addr: 127.0.0.1:__GOST_WARP_PORT__
    handler:
      type: auto
      chain: warp
    listener:
      type: tcp

chains:
  - name: direct
    hops:
      - name: direct
        nodes:
          - name: direct
            addr: "__DOMAIN__:443"
            connector:
              type: relay
              auth:
                username: gost
                password: "__PASSWORD__"
              metadata:
                nodelay: true
            dialer:
              type: wss
              tls:
                secure: true
              metadata:
                path: "/__GOST_DIRECT_PATH__"
                handshakeTimeout: 10s
                keepAlive: true
                ttl: 30s
  - name: warp
    hops:
      - name: warp
        nodes:
          - name: warp
            addr: "__DOMAIN__:443"
            connector:
              type: relay
              auth:
                username: gost
                password: "__PASSWORD__"
              metadata:
                nodelay: true
            dialer:
              type: wss
              tls:
                secure: true
              metadata:
                path: "/__GOST_WARP_PATH__"
                handshakeTimeout: 10s
                keepAlive: true
                ttl: 30s

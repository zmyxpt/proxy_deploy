services:
  - name: gost_direct
    addr: 127.0.0.1:__GOST_DIRECT_PORT__
    handler:
      type: auto
      chain: gost_direct
    listener:
      type: tcp
  - name: gost_warp
    addr: 127.0.0.1:__GOST_WARP_PORT__
    handler:
      type: auto
      chain: gost_warp
    listener:
      type: tcp

chains:
  - name: gost_direct
    hops:
      - name: gost_direct
        nodes:
          - name: gost_direct
            addr: "__DOMAIN__:443"
            connector:
              type: relay
              auth:
                username: gost
                password: "__PASSWORD__"
              metadata:
                nodelay: true
            dialer:
              type: wss
              tls:
                secure: true
              metadata:
                path: "/__GOST_DIRECT_PATH__"
                handshakeTimeout: 10s
                keepAlive: true
                ttl: 30s
  - name: gost_warp
    hops:
      - name: gost_warp
        nodes:
          - name: gost_warp
            addr: "__DOMAIN__:443"
            connector:
              type: relay
              auth:
                username: gost
                password: "__PASSWORD__"
              metadata:
                nodelay: true
            dialer:
              type: wss
              tls:
                secure: true
              metadata:
                path: "/__GOST_WARP_PATH__"
                handshakeTimeout: 10s
                keepAlive: true
                ttl: 30s
